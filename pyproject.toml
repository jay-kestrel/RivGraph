[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "rivgraph"
dynamic = ["version"]
description = "Python package for extracting and analyzing river and delta channel networks from remote sensing imagery."
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.12"
license = "BSD-3-Clause"
license-files = ["LICENSE.txt"]
authors = [
  { name = "Jon Schwenk", email = "jonschwenk@gmail.com" }
]
keywords = [
  "river networks",
  "delta networks",
  "remote sensing",
  "geospatial",
  "hydrology",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: GIS",
  "Topic :: Scientific/Engineering :: Image Processing",
]

dependencies = [
  "numpy>=2,<2.3",
  "scipy>=1.11,<1.14",
  "pandas>=2.2,<2.3",
  "matplotlib>=3.8,<3.11",
  "networkx>=2.8,<3.3",
  "scikit-image>=0.22,<0.25",
  "shapely>=2.1,<2.2",
  "geopandas>=1.1,<1.2",
  "pyproj>=3.6,<3.8",
  "rasterio>=1.4,<1.5",
  "affine>=2.3,<3",
  "pyogrio>=0.11.1,<0.13",
  "contextily>=1.6,<2",
  "Pillow",
  "PyYAML",
  "loguru",
  "fastdtw",
]

[project.optional-dependencies]
docs = [
  "sphinx>=7,<9",
  "sphinx-rtd-theme>=2,<4",
]
notebooks = [
  "jupyterlab",
  "ipykernel",
  "nbconvert",
  "nbclient",
  "jupytext",
]
test = [
  "pytest>=8,<9",
]
bench = [
  "pytest>=8,<9",
  "pytest-benchmark>=4,<6",
]

[project.urls]
Homepage = "https://veinsoftheearth.github.io/RivGraph/"
Documentation = "https://veinsoftheearth.github.io/RivGraph/"
Repository = "https://github.com/VeinsOfTheEarth/RivGraph"
Issues = "https://github.com/VeinsOfTheEarth/RivGraph/issues"

[project.scripts]
rivgraph = "rivgraph.cli:main"

[tool.maturin]
python-source = "."
module-name = "rivgraph._native"
features = ["pyo3/extension-module"]
include = ["LICENSE.txt"]

[tool.pytest.ini_options]
# Warnings are errors so that new warning regressions fail CI; the ignore
# entries below are narrow exemptions for known, justified non-regressions.
filterwarnings = [
  "error",
  # Upstream pyogrio<fixed-version imports shapely.geos at import time, which
  # triggers a deprecation warning under modern Shapely. Third-party noise.
  "ignore:The 'shapely\\.geos' module is deprecated, and will be removed in a future version\\.:DeprecationWarning:pyogrio.*",
  # rasterio 1.4 warns about Affine's `*` operator from its own
  # rasterio.transform module; third-party noise, not a RivGraph regression.
  "ignore:Use `@` matmul instead of `\\*` mul operator:PendingDeprecationWarning:rasterio.*",
  # RivGraph's own shapefile-lossiness contract warning. The regression suites
  # exercise shapefile export but assert results, not warning absence.
  "ignore:Exporting to ESRI Shapefile may be lossy:UserWarning",
  # RivGraph's own informational notice that delta metrics run on an internal
  # transformed graph (parallel links broken by artificial nodes; the original
  # network is unchanged). Expected on every delta-metrics call over a network
  # with parallel links; test_delta_metrics asserts it via pytest.warns, and
  # the scenario suites assert results, not warning absence.
  "ignore:Parallel links detected:UserWarning",
  # Known NumPy deprecations inside rivgraph.im_utils (np.in1d and
  # array-to-scalar conversion); cleanup is tracked separately from logging.
  "ignore:`in1d` is deprecated:DeprecationWarning",
  "ignore:Conversion of an array with ndim > 0 to a scalar:DeprecationWarning",
]

markers = [
  # Full-pipeline scenario runs (scenarios suite) are long; the quick subset
  # runs in the default suite, full runs on demand and in scenarios.yml.
  "slow: long-running full-pipeline scenario runs (deselect with '-m not slow')",
]


# -----------------------------------------------------------------------
# Ruff (lint gate added in RV-3)
#
# Minimal first gate: the pycodestyle-error and pyflakes rule families,
# pinned explicitly so a future ruff default change cannot silently widen
# the gate. The rule set is fully active on new modules and tests; legacy
# modules are exempted per-file below rather than globally, so a file drops
# its exemptions as its violations are cleaned up.
[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# Legacy modules: pervasive scientific-Python idioms (single-letter names,
# `== True` comparisons, occasional unused imports) predate the gate; clean
# them up incrementally rather than en masse.
"examples/mouse_brain_example.ipynb" = ["E402", "E741", "F401", "F811"]
"examples/mouse_brain_example.py" = ["E402", "E741", "F401", "F811"]
"rivgraph/classes.py" = ["E711"]
"rivgraph/deltas/delta_directionality.py" = ["E741", "F401"]
"rivgraph/deltas/delta_metrics.py" = ["E712", "E741"]
"rivgraph/deltas/delta_utils.py" = ["E741"]
"rivgraph/directionality.py" = ["E722", "E741"]
"rivgraph/geo_utils.py" = ["F401"]
"rivgraph/im_utils.py" = ["E712", "E741"]
"rivgraph/io_utils.py" = ["E741"]
"rivgraph/ln_utils.py" = ["E711", "E712", "E721", "E741", "F841"]
"rivgraph/mask_to_graph.py" = ["E712", "E741"]
"rivgraph/mask_utils.py" = ["E741"]
"rivgraph/rasters.py" = ["E741"]
"rivgraph/rivers/river_directionality.py" = ["E712", "E741", "F401", "F841"]
"rivgraph/rivers/river_utils.py" = ["E702", "E712", "E721", "E741", "F401"]
"rivgraph/walk.py" = ["E741"]
"tests/regression/test_river_regression.py" = ["F401"]
"tests/test_cli.py" = ["F841"]
"tests/test_im_utils_regionprops.py" = ["E741"]
"tests/test_im_utils_skeleton.py" = ["E741"]
"tests/test_logging_conventions.py" = ["E741"]
"tests/test_rv1_legacy_crash_fixes.py" = ["E741"]
"tests/test_rv2_parallel_link_surgery.py" = ["E741"]
"tests/test_walk.py" = ["E741"]

