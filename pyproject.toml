[build-system]
requires = ["maturin>=1.9,<2"]
build-backend = "maturin"

[project]
name = "rivgraph"
dynamic = ["version"]
description = "Python package for extracting and analyzing river and delta channel networks from remote sensing imagery."
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.12"
license = "BSD-3-Clause"
license-files = ["LICENSE.txt"]
authors = [
  { name = "Jon Schwenk", email = "jonschwenk@gmail.com" }
]
keywords = [
  "river networks",
  "delta networks",
  "remote sensing",
  "geospatial",
  "hydrology",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: GIS",
  "Topic :: Scientific/Engineering :: Image Processing",
]

dependencies = [
  "numpy>=2,<2.3",
  "scipy>=1.11,<1.14",
  "pandas>=2.2,<2.3",
  "matplotlib>=3.8,<3.11",
  "networkx>=2.8,<3.3",
  "scikit-image>=0.22,<0.25",
  "shapely>=2.1,<2.2",
  "geopandas>=1.1,<1.2",
  "pyproj>=3.6,<3.8",
  "rasterio>=1.4,<1.5",
  "pyogrio>=0.11.1,<0.13",
  "contextily>=1.6,<2",
  "Pillow",
  "PyYAML",
  "loguru",
  "fastdtw",
]

[project.optional-dependencies]
docs = [
  "sphinx>=7,<9",
  "sphinx-rtd-theme>=2,<4",
]
notebooks = [
  "jupyterlab",
  "ipykernel",
  "nbconvert",
  "nbclient",
  "jupytext",
]
test = [
  "pytest>=8,<9",
]
bench = [
  "pytest>=8,<9",
  "pytest-benchmark>=4,<6",
]

[project.urls]
Homepage = "https://veinsoftheearth.github.io/RivGraph/"
Documentation = "https://veinsoftheearth.github.io/RivGraph/"
Repository = "https://github.com/VeinsOfTheEarth/RivGraph"
Issues = "https://github.com/VeinsOfTheEarth/RivGraph/issues"

[tool.maturin]
python-source = "."
module-name = "rivgraph._native"
features = ["pyo3/extension-module"]
include = ["LICENSE.txt"]
