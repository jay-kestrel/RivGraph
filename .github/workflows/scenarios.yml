name: scenarios

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  scenarios-quick:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Release-asset publication of the two report files (see the publish
    # step); everything else needs only the implicit read defaults.
    permissions:
      contents: write

    steps:
      # The repo Actions policy only permits actions from repositories owned by
      # jay-kestrel, so checkout, the Rust toolchain, and the conda environment
      # are inlined as run steps (actions/checkout, dtolnay/rust-toolchain, and
      # conda-incubator/setup-miniconda are unavailable). This fetches
      # refs/heads/<branch> on push and GitHub's pre-merged refs/pull/<n>/merge
      # on pull_request — the same commits actions/checkout would provide.
      - name: Checkout
        run: |
          git init "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" remote add origin "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git"
          git -C "$GITHUB_WORKSPACE" fetch --depth=1 origin "${GITHUB_REF}"
          git -C "$GITHUB_WORKSPACE" checkout --detach FETCH_HEAD

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          cargo --version

      # environment.yml's conda dependencies are installed with pip instead —
      # conda-incubator/setup-miniconda is unavailable under the repo policy.
      # The venv goes on GITHUB_PATH so every later step resolves inside it.
      - name: Set up Python environment
        run: |
          python3 --version
          python3 -m venv "$RUNNER_TEMP/venv"
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"

      - name: Install RivGraph
        run: |
          # numpy first: the rust-numpy build resolves its bindings ABI from
          # the interpreter's numpy before pyproject deps are installed.
          pip install "numpy>=2,<2.3"
          pip install -e .

      - name: Run quick scenario suite
        run: |
          python -m scenarios --quick
          echo "--- SCENARIOS.md ---"
          cat scenarios_results/SCENARIOS.md

      # actions/upload-artifact@v4 is unavailable under the repo Actions
      # policy, and Actions artifacts have no upload REST API — the docs
      # workflow reached the same conclusion for the Pages tar. The two
      # reports are therefore published as the run commit's pre-release
      # assets: individually downloadable per run, replaced when the same
      # commit re-runs.
      - name: Publish scenario reports
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}"
          tag="scenario-results-${GITHUB_SHA}"
          release="$(curl -sS -f \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "${api}/releases/tags/${tag}" || true)"
          if [ -z "${release}" ]; then
            release="$(curl -sS -f -X POST \
              -H 'Accept: application/vnd.github+json' \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              -d "{\"tag_name\": \"${tag}\", \"target_commitish\": \"${GITHUB_SHA}\", \"name\": \"scenario results ${GITHUB_SHA}\", \"prerelease\": true}" \
              "${api}/releases")"
          fi
          for name in scenario_results.json SCENARIOS.md; do
            asset_id="$(printf '%s' "${release}" | jq -r ".assets[] | select(.name == \"${name}\") | .id")"
            if [ -n "${asset_id}" ]; then
              curl -sS -f -X DELETE \
                -H "Authorization: Bearer ${GH_TOKEN}" \
                -H 'X-GitHub-Api-Version: 2022-11-28' \
                "${api}/releases/assets/${asset_id}" > /dev/null
            fi
            upload_url="$(printf '%s' "${release}" | jq -r '.upload_url' | sed 's/{?name,label}//')"
            curl -sS -f -X POST \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H 'Content-Type: application/octet-stream' \
              --data-binary "@scenarios_results/${name}" \
              "${upload_url}?name=${name}" > /dev/null
            echo "published ${name} to release ${tag}"
          done
