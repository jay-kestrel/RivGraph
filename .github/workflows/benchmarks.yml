name: benchmarks

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
      - 'release/**'
  workflow_dispatch:

jobs:
  pytest-benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      # The repo Actions policy only permits actions from repositories owned by
      # jay-kestrel, so checkout, the Rust toolchain, and the conda environment
      # are inlined as run steps (actions/checkout, dtolnay/rust-toolchain, and
      # conda-incubator/setup-miniconda are unavailable). This fetches
      # refs/heads/<branch> on push and GitHub's pre-merged refs/pull/<n>/merge
      # on pull_request — the same commits actions/checkout would provide.
      - name: Checkout
        run: |
          git init "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" remote add origin "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git"
          git -C "$GITHUB_WORKSPACE" fetch --depth=1 origin "${GITHUB_REF}"
          git -C "$GITHUB_WORKSPACE" checkout --detach FETCH_HEAD

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          cargo --version

      # environment.yml's conda dependencies are installed with pip instead —
      # conda-incubator/setup-miniconda is unavailable under the repo policy.
      # The venv goes on GITHUB_PATH so every later step resolves inside it.
      - name: Set up Python environment
        run: |
          python3 --version
          python3 -m venv "$RUNNER_TEMP/venv"
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"

      - name: Install RivGraph
        run: |
          # numpy first: the rust-numpy build resolves its bindings ABI from
          # the interpreter's numpy before pyproject deps are installed.
          pip install "numpy>=2,<2.3"
          pip install -e .
          pip install "pytest-benchmark>=4,<6"

      - name: Install GnuCOBOL and build the COBOL backend
        shell: bash -el {0}
        run: |
          sudo apt-get update
          sudo apt-get install -y gnucobol3
          cobc --version
          make -C cobol

      - name: Run benchmark suite
        run: |
          mkdir -p bench_results
          python -m pytest bench/ -ra \
            --benchmark-columns=rounds,min,median,mean,stddev \
            --benchmark-sort=name \
            --benchmark-json=bench_results/baseline.json

      # actions/upload-artifact@v4 is unavailable under the repo Actions
      # policy; the baseline JSON remains in the job's working tree and the
      # benchmark run's log output carries the measured numbers.
