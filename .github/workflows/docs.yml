name: docs

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
      - 'release/**'
  workflow_dispatch:

# Pages deploy scaffolding was removed: the org Actions policy rejects every
# actions/* reference at job setup — even references inside steps whose `if:`
# guards are false (observed on run 41114548646, where fork-guarded
# configure-pages@v5 and upload-pages-artifact@v4 were named in the rejection).
# The Pages actions are not owned by jay-kestrel, so Pages deploys can never
# run in this repository. Restore them only if jay-kestrel-owned forks of the
# Pages actions are provisioned and allowlisted.
permissions:
  contents: read

jobs:
  build-docs:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      # The repo Actions policy only permits actions from repositories owned by
      # jay-kestrel, so checkout, the Rust toolchain, and the conda environment
      # are inlined as run steps (actions/checkout, dtolnay/rust-toolchain, and
      # conda-incubator/setup-miniconda are unavailable). This fetches
      # refs/heads/<branch> on push and GitHub's pre-merged refs/pull/<n>/merge
      # on pull_request — the same commits actions/checkout would provide.
      - name: Checkout
        run: |
          git init "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" remote add origin "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git"
          git -C "$GITHUB_WORKSPACE" fetch --depth=1 origin "${GITHUB_REF}"
          git -C "$GITHUB_WORKSPACE" checkout --detach FETCH_HEAD

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          cargo --version

      # environment.yml's conda dependencies are installed with pip instead —
      # conda-incubator/setup-miniconda is unavailable under the repo policy.
      # The venv goes on GITHUB_PATH so every later step resolves inside it.
      - name: Set up Python environment
        run: |
          python3 --version
          python3 -m venv "$RUNNER_TEMP/venv"
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"

      - name: Install RivGraph and docs extras
        run: |
          # numpy first: the rust-numpy build resolves its bindings ABI from
          # the interpreter's numpy before pyproject deps are installed.
          pip install "numpy>=2,<2.3"
          pip install -e ".[docs]"

      - name: Build docs
        run: |
          make -C docs html

      # No Pages steps here (see note at permissions): configure-pages,
      # upload-pages-artifact, and deploy-pages are org-policy-rejected at job
      # setup even when fork-guarded, so the deploy job was removed with them.
      # Docs artifacts are validated by the build-docs job itself.
